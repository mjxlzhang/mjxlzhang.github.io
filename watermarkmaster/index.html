<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠无忧 - 本地白噪音，助你入眠</title>
<style>
  :root { --accent: #8B5CF6; --bg: #ffffff; --text: #1c1c1e; --sub: #6b7280; --card: #f5f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --text: #f5f5f7; --sub: #9ca3af; --card: #1c1c1e; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
  .container { max-width: 720px; margin: 0 auto; padding: 60px 24px; text-align: center; }
  .icon { font-size: 72px; margin-bottom: 24px; }
  h1 { font-size: 34px; font-weight: 700; margin: 0 0 12px; }
  .tagline { font-size: 18px; color: var(--sub); margin-bottom: 40px; }
  .features { text-align: left; margin: 40px 0; }
  .feature { display: flex; align-items: flex-start; gap: 16px; padding: 16px; background: var(--card); border-radius: 14px; margin-bottom: 12px; }
  .feature-icon { font-size: 28px; flex-shrink: 0; }
  .feature-text h3 { font-size: 16px; margin: 0 0 4px; }
  .feature-text p { font-size: 14px; color: var(--sub); margin: 0; }
  .cta { display: inline-block; margin-top: 32px; padding: 14px 40px; background: var(--accent); color: #fff; border-radius: 14px; font-size: 17px; font-weight: 500; text-decoration: none; }
  footer { margin-top: 60px; font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">🌙</div>
  <h1>睡眠无忧</h1>
  <p class="tagline">本地白噪音，助你入眠</p>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">🎵</div>
      <div class="feature-text">
        <h3>148 种自然声音</h3>
        <p>雨声、篝火、海浪、森林鸟鸣…自由混音，独立调音量</p>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">⏱</div>
      <div class="feature-text">
        <h3>定时关闭</h3>
        <p>设定倒计时，到点自动淡出，安心入睡</p>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">🫁</div>
      <div class="feature-text">
        <h3>呼吸练习</h3>
        <p>4-7-8、箱式、腹式、4-2-6，四种科学呼吸法</p>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">🔒</div>
      <div class="feature-text">
        <h3>完全离线</h3>
        <p>零网络请求，不收集任何数据，隐私无忧</p>
      </div>
    </div>
  </div>

  <a class="cta" href="https://apps.apple.com/app/idYOUR_APP_ID">前往 App Store</a>

  <footer>© 2026 睡眠无忧 SleepMaster. All rights reserved.</footer>
</div>
</body>
</html>
